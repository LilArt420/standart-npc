# standart-npc: turns on two of the fork's extensions for Attendance Check.
# attendance_repeat: the 20 rewards start over after day 20
# (Flux159/rathena#29). attendance_script_rewards: the rewards chosen in the
# Settings… window are applied by npc/when/enable_attendance/attendance_rewards.txt.
# Both need an app whose pinned rathena has them.
# @extensioninfo attendance_repeat / attendance_script_rewards

Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: attendance_repeat
    Enabled: true
  - Id: attendance_script_rewards
    Enabled: true
