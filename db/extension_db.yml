# standart-npc: turns on the fork's stylist_script_costs extension, so
# npc/stylist.txt can set the stylist window's costs from the settings
# (setstylistcost). An order with several changes is then bought whole or
# not at all. Needs an app whose pinned rathena has it (Flux159/rathena#47).
# The app adds this table to db/when/<key>/extension_db.yml's ones.
# @extensioninfo stylist_script_costs

Header:
  Type: EXTENSION_DB
  Version: 1

Body:
  - Id: stylist_script_costs
    Enabled: true
