# standart-npc: the Pre-renewal stylist window's options. rAthena ships them
# for Renewal only (db/re/stylist.yml), so on Pre-renewal the window would
# offer nothing. Same options and indices as db/re/stylist.yml, for hair
# style, hair color and cloth color (the alternative outfit is Renewal only).
# The costs here are only a fallback: npc/stylist.txt sets each look's cost
# from the mod's settings (setstylistcost, extension stylist_script_costs).
# Licence: GPL-3.0, based on rAthena's db/re/stylist.yml (see LICENSE and
# LICENSE-GPL-3.0).

